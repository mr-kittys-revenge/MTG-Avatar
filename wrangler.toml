# Minimal wrangler config for Cloudflare Pages.
#
# All production bindings (KV namespace, SHARED_PASSWORD, GEMINI_API_KEY,
# GEMINI_MODEL) are configured in the Cloudflare Pages dashboard
# (Settings → Bindings, Settings → Variables and Secrets).
#
# DO NOT add [[kv_namespaces]] or [vars] sections here unless you want them
# to override the dashboard config. Cloudflare deploy will fail if any binding
# IDs here are invalid.
#
# For local dev with `wrangler pages dev .`, copy `.dev.vars.example` to
# `.dev.vars` and set values there (gitignored).

name = "mtg-avatar-tracker"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."
